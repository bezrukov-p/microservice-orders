spring:
  application:
    name: microservice-orders
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  datasource:
    url: jdbc:postgresql://localhost:5432/orders_db
    username: admin
    password: admin

jwt:
  secret: "c2VjcmV0S2V5V2l0aEF0TGVhc3QyNTZCaXRzRm9ySFM1MTJBbGdvcml0aG0="
  expiration: 900000  # 15 minutes
  refreshExpiration: 2592000000  # 30 days
management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
          transport: http
    tracing:
      export:
        otlp:
          transport: http
          endpoint: http://localhost:4318/v1/traces